<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light;" version="1.1" width="1672px" height="1648px" viewBox="0 0 1672 1648"><title>Слои исполнения: native Codex и optional tooling</title><desc>Supervisor управляет задачей; штатный клиент связывает выбранную модель и инструменты на пользовательском host.</desc><rect x="0" y="0" width="1672" height="1648" fill="#FFFFFF" /><defs /><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="62" y="24" width="1560" height="52" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="64" y="60" fill="#18324F" font-family="Arial" font-size="32px" style="fill: rgb(24, 50, 79);">Слои исполнения: native Codex и optional tooling</text></g></g></g><g data-cell-id="desc"><g><rect x="62" y="81" width="1560" height="40" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="64" y="107" fill="#18324F" font-family="Arial" font-size="19px" style="fill: rgb(24, 50, 79);">Supervisor управляет задачей; штатный клиент связывает выбранную модель и инструменты на пользовательском host.</text></g></g></g><g data-cell-id="User"><g><rect x="542" y="139" width="600" height="90" rx="9" ry="9" fill="#eaf2fb" stroke="#53779d" stroke-width="2" pointer-events="all" style="fill: rgb(234, 242, 251); stroke: rgb(83, 119, 157);" /></g><g><g><text x="842" y="178" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="842" y="178">Пользователь</tspan><tspan x="842" y="202">Цель · scope · действующие разрешения</tspan></text></g></g></g><g data-cell-id="Codex"><g><rect x="62" y="314" width="460" height="195" rx="19.5" ry="19.5" fill="#eaf2fb" stroke="#53779d" stroke-width="2" pointer-events="all" style="fill: rgb(234, 242, 251); stroke: rgb(83, 119, 157);" /></g><g><g><text x="292" y="358" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="292" y="358">Codex — backend по умолчанию</tspan><tspan x="292" y="382">Исходный native-режим сохранён</tspan><tspan x="292" y="406">Native tools / shell / delegation</tspan><tspan x="292" y="430">Managed exec / exact-session resume</tspan><tspan x="292" y="454">Strict transport — отдельный opt-in</tspan><tspan x="292" y="478">Tool Profiles выбираются отдельно</tspan></text></g></g></g><g data-cell-id="Work"><g><rect x="572" y="314" width="540" height="195" rx="19.5" ry="19.5" fill="#eaf2fb" stroke="#53779d" stroke-width="2" pointer-events="all" style="fill: rgb(234, 242, 251); stroke: rgb(83, 119, 157);" /></g><g><g><text x="842" y="382" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="842" y="382">Supervisor managed flow</tspan><tspan x="842" y="406">DAG · scopes · отдельные worktrees</tspan><tspan x="842" y="430">До 12 sessions, включая до 3 reviewers</tspan><tspan x="842" y="454">Checkpoints · retry · общие budgets</tspan></text></g></g></g><g data-cell-id="Exec"><g><rect x="1162" y="314" width="460" height="195" rx="19.5" ry="19.5" fill="#eaf2fb" stroke="#53779d" stroke-width="2" pointer-events="all" style="fill: rgb(234, 242, 251); stroke: rgb(83, 119, 157);" /></g><g><g><text x="1392" y="370" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="1392" y="370">OpenCode 2.2.5 — optional managed leaf</tspan><tspan x="1392" y="394">Native permissions + runtime guard</tspan><tspan x="1392" y="418">--standalone: private owned server</tspan><tspan x="1392" y="442">OpenCode-native subagents:</tspan><tspan x="1392" y="466">NOT_IMPLEMENTED</tspan></text></g></g></g><g data-cell-id="Profiles"><g><rect x="62" y="579" width="460" height="165" rx="16.5" ry="16.5" fill="#e8f6f2" stroke="#3d8173" stroke-width="2" pointer-events="all" style="fill: rgb(232, 246, 242); stroke: rgb(61, 129, 115);" /></g><g><g><text x="292" y="632" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="292" y="632">Tool Profiles — optional policy</tspan><tspan x="292" y="656">Baseline без внешних dependencies</tspan><tspan x="292" y="680">Выбранный профиль → native config</tspan><tspan x="292" y="704">Role permissions + catalog audit</tspan></text></g></g></g><g data-cell-id="State"><g><rect x="572" y="579" width="540" height="165" rx="16.5" ry="16.5" fill="#f0f3f7" stroke="#718297" stroke-width="2" pointer-events="all" style="fill: rgb(240, 243, 247); stroke: rgb(113, 130, 151);" /></g><g><g><text x="842" y="632" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="842" y="632">Private локальное состояние</tspan><tspan x="842" y="656">Journal · typed receipts · checkpoints</tspan><tspan x="842" y="680">Memory recall + Ledger inform + reducer</tspan><tspan x="842" y="704">Без новой БД или обязательного daemon</tspan></text></g></g></g><g data-cell-id="Provider"><g><rect x="1162" y="579" width="460" height="165" rx="16.5" ry="16.5" fill="#f2edfa" stroke="#8367a6" stroke-width="2" pointer-events="all" style="fill: rgb(242, 237, 250); stroke: rgb(131, 103, 166);" /></g><g><g><text x="1392" y="632" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="1392" y="632">OpenRouter — provider модели OpenCode</tspan><tspan x="1392" y="656">Hydrogen/Flex, DeepSeek FP8: no fallback</tspan><tspan x="1392" y="680">Opus 5.5: без route pin</tspan><tspan x="1392" y="704">Auth хранится в штатном клиенте</tspan></text></g></g></g><g data-cell-id="MCP"><g><rect x="62" y="859" width="460" height="200" rx="20" ry="20" fill="#e8f6f2" stroke="#3d8173" stroke-width="2" pointer-events="all" style="fill: rgb(232, 246, 242); stroke: rgb(61, 129, 115);" /></g><g><g><text x="292" y="917" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="292" y="917">MCP на пользовательском host</tspan><tspan x="292" y="941">Serena 2.1.0: сервер/cache на worktree</tspan><tspan x="292" y="965">Context7 4.6.0: public docs reads</tspan><tspan x="292" y="989">Playwright MCP 0.0.85: конечный запуск</tspan><tspan x="292" y="1013">Exact loopback origins · private artifacts</tspan></text></g></g></g><g data-cell-id="CLI"><g><rect x="572" y="859" width="540" height="200" rx="20" ry="20" fill="#e8f6f2" stroke="#3d8173" stroke-width="2" pointer-events="all" style="fill: rgb(232, 246, 242); stroke: rgb(61, 129, 115);" /></g><g><g><text x="842" y="917" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="842" y="917">Локальные CLI и source tools</tspan><tspan x="842" y="941">Graphify graphifyy 0.9.111: frozen index</tspan><tspan x="842" y="965">Commit + dirty bytes + config/tool digests</tspan><tspan x="842" y="989">ast-grep 0.51.3: before/rewrite/diff/after/tests</tspan><tspan x="842" y="1013">RepoMap · LSP · source packets</tspan></text></g></g></g><g data-cell-id="Managed"><g><rect x="1162" y="859" width="460" height="200" rx="20" ry="20" fill="#eaf2fb" stroke="#53779d" stroke-width="2" pointer-events="all" style="fill: rgb(234, 242, 251); stroke: rgb(83, 119, 157);" /></g><g><g><text x="1392" y="917" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="1392" y="917">Isolated managed workers</tspan><tspan x="1392" y="941">Один writer на worktree</tspan><tspan x="1392" y="965">Client/profile/source/index binding</tspan><tspan x="1392" y="989">Собственные MCP connections/cache</tspan><tspan x="1392" y="1013">Checks запускает supervisor</tspan></text></g></g></g><g data-cell-id="Candidate"><g><rect x="572" y="1189" width="1050" height="135" rx="13.5" ry="13.5" fill="#e8f1f6" stroke="#486b83" stroke-width="2" pointer-events="all" style="fill: rgb(232, 241, 246); stroke: rgb(72, 107, 131);" /></g><g><g><text x="1097" y="1239" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="1097" y="1239">Общий candidate и source-bound acceptance</tspan><tspan x="1097" y="1263">Integration → freeze → independent checks / requirement coverage</tspan><tspan x="1097" y="1287">Fresh independent review → final gate; MCP success не означает ACCEPTED</tspan></text></g></g></g><g data-cell-id="Limits"><g><rect x="62" y="1379" width="1560" height="155" rx="15.5" ry="15.5" fill="#fff3e0" stroke="#b7802f" stroke-width="2" pointer-events="all" style="fill: rgb(255, 243, 224); stroke: rgb(183, 128, 47);" /></g><g><g><text x="842" y="1427" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="842" y="1427">Границы квалификации</tspan><tspan x="842" y="1451">Strict Codex transport EXPERIMENTAL: 0.167.0 + scripted provider; paid workload UNQUALIFIED.</tspan><tspan x="842" y="1475">OpenCode: подтверждён конкретный Hydrogen + Serena + Context7 smoke; новый run требует fresh proof.</tspan><tspan x="842" y="1499">Docling исключён и не установлен. Схема не подтверждает приёмку новой задачи или публикацию релиза.</tspan></text></g></g></g><g data-cell-id="e1"><g><path d="M 602 229 L 602 274 L 292 274 L 292 303.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 292 311.76 L 288 303.76 L 296 303.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="425" y="264" width="50" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="449" y="282">native</text></g></g></g><g data-cell-id="e2"><g><path d="M 842 229 L 842 303.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 842 311.76 L 838 303.76 L 846 303.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="804" y="262" width="77" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="842" y="280">managed</text></g></g></g><g data-cell-id="e3"><g><path d="M 572 411.5 L 532.24 411.5" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 524.24 411.5 L 532.24 407.5 L 532.24 415.5 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g></g><g data-cell-id="e4"><g><path d="M 1112 411.5 L 1151.76 411.5" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 1159.76 411.5 L 1151.76 415.5 L 1151.76 407.5 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g></g><g data-cell-id="e5"><g><path d="M 292 509 L 292 568.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 292 576.76 L 288 568.76 L 296 568.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFF