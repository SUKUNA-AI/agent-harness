; stroke: rgb(82, 106, 130);" /></g></g><g data-cell-id="footer"><g><rect x="62" y="1554" width="1560" height="45" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="64" y="1582" fill="#18324F" font-family="Arial" font-size="17px" style="fill: rgb(24, 50, 79);">Source main после 1.7.0 • OpenRouter не является MCP host • Нет глобального auto-MCP или hot reload открытой сессии.</text></g></g></g></g></g></g></svg>