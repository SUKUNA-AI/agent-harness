34" y="1020">codex_catalog + JSONL</text></g></g></g><g data-cell-id="j"><g><path d="M 694 1154 L 694 1224.82" fill="none" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 694 1232.32 L 690.25 1224.82 L 697.75 1224.82 Z" fill="#526a82" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#000000" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(0, 0, 0);"><rect fill="#FFFFFF" stroke="none" x="616" y="1186" width="157" height="18" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="694" y="1200">completion ≠ acceptance</text></g></g></g><g data-cell-id="policy"><g><rect x="444" y="169" width="500" height="100" rx="15" ry="15" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);" /></g><g><g><switch><text x="694" y="204" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="694" y="204">Strict YAML policy</tspan><tspan x="694" y="224">ID/version · role · backend · allow/deny</tspan><tspan x="694" y="244">required tools · worktree/cache binding</tspan></text></switch></g></g></g><g data-cell-id="codex"><g><rect x="44" y="334" width="560" height="100" rx="15" ry="15" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);" /></g><g><g><switch><text x="324" y="369" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="324" y="369">Codex renderer</tspan><tspan x="324" y="389">mcp_servers · enabled/disabled_tools</tspan><tspan x="324" y="409">startup_readiness = connection</tspan></text></switch></g></g></g><g data-cell-id="oc"><g><rect x="784" y="334" width="560" height="100" rx="15" ry="15" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);" /></g><g><g><switch><text x="1064" y="369" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="1064" y="369">OpenCode V2 renderer</tspan><tspan x="1064" y="389">harness-leaf · permissions · deny policies</tspan><tspan x="1064" y="409">Code Mode off · pool off</tspan></text></switch></g></g></g><g data-cell-id="probe"><g><rect x="444" y="499" width="500" height="115" rx="17.25" ry="17.25" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);" /></g><g><g><switch><text x="694" y="542" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="694" y="542">Dependency preflight</tspan><tspan x="694" y="562">contained process → initialize → tools/list → ping</tspan><tspan x="694" y="582">executable/version · catalog digest · stop tree</tspan></text></switch></g></g></g><g data-cell-id="cxcat"><g><rect x="44" y="684" width="560" height="105" rx="15.75" ry="15.75" fill="#fff2cc" stroke="#b58b00" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 242, 204); stroke: rgb(181, 139, 0);" /></g><g><g><switch><text x="324" y="722" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="324" y="722">Codex diagnostic app-server</tspan><tspan x="324" y="742">ephemeral thread без model turn</tspan><tspan x="324" y="762">qualified_for_exec: false</tspan></text></switch></g></g></g><g data-cell-id="occat"><g><rect x="784" y="684" width="560" height="105" rx="15.75" ry="15.75" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);" /></g><g><g><switch><text x="1064" y="722" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="1064" y="722">OpenCode native rehearsal</tspan><tspan x="1064" y="742">pre-turn catalog · permissions · exact session</tspan><tspan x="1064" y="762">без provider dispatch; proof не переносится</tspan></text></switch></g></g></g><g data-cell-id="cxdeny"><g><rect x="44" y="869" width="560" height="105" rx="15.75" ry="15.75" fill="#fff2cc" stroke="#b58b00" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 242, 204); stroke: rgb(181, 139, 0);" /></g><g><g><switch><text x="324" y="907" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="324" y="907">Strict Codex: owned stdio app-server</tspan><tspan x="324" y="927">Тот же thread: census → turn → census</tspan><tspan x="324" y="947">Fresh native qualification обязательна</tspan></text></switch></g></g></g><g data-cell-id="ocguard"><g><rect x="784" y="869" width="560" height="105" rx="15.75" ry="15.75" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);" /></g><g><g><switch><text x="1064" y="907" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="1064" y="907">Реальный OpenCode invocation</tspan><tspan x="1064" y="927">Повторная qualification + private guard</tspan><tspan x="1064" y="947">Runtime catalog / post-dispatch connection</tspan></text></switch></g></g></g><g data-cell-id="pin"><g><rect x="444" y="1054" width="500" height="100" rx="15" ry="15" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);" /></g><g><g><switch><text x="694" y="1089" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="694" y="1089">Durable completion receipt</tspan><tspan x="694" y="1109">session · process tree stopped · usage</tspan><tspan x="694" y="1129">JSONL hash + runtime catalog artifacts</tspan></text></switch></g></g></g><g data-cell-id="gate"><g><rect x="274" y="1234" width="840" height="105" rx="15.75" ry="15.75" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" pointer-events="all" style="fill: rgb(213, 232, 212); stroke: rgb(130, 179, 102);" /></g><g><g><switch><text x="694" y="1272" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="694" y="1272">Freeze → independent checks → fresh review → gate</tspan><tspan x="694" y="1292">Тот же candidate, требования и source/tool provenance</tspan><tspan x="694" y="1312">Только gate подтверждает результат задачи</tspan></text></switch></g></g></g><g data-cell-id="bounds"><g><rect x="94" y="1394" width="1200" height="85" rx="12.75" ry="12.75" fill="#fff2cc" stroke="#b58b00" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 242, 204); stroke: rgb(181, 139, 0);" /></g><g><g><switch><text x="694" y="1432" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="694" y="1432">Общая граница: baseline не требует новых MCP. Missing required dependency → BLOCKED.</tspan><tspan x="694" y="1452">Нет автоматической установки tools, новой БД, daemon или дополнительного model API.</tspan></text></switch></g></g></g></g></g></g></svg>