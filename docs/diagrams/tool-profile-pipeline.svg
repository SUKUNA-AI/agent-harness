stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#000000" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(0, 0, 0);"><rect fill="#FFFFFF" stroke="none" x="359" y="641" width="151" height="18" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="434" y="655">отдельное соединение</text></g></g></g><g data-cell-id="f"><g><path d="M 844 614 L 844 649 L 1064 649 L 1064 674.82" fill="none" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 1064 682.32 L 1060.25 674.82 L 1067.75 674.82 Z" fill="#526a82" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#000000" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(0, 0, 0);"><rect fill="#FFFFFF" stroke="none" x="917" y="641" width="76" height="18" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="954" y="655">native client</text></g></g></g><g data-cell-id="g"><g><path d="M 324 789 L 324 859.82" fill="none" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 324 867.32 L 320.25 859.82 L 327.75 859.82 Z" fill="#526a82" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#000000" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(0, 0, 0);"><rect fill="#FFFFFF" stroke="none" x="254" y="821" width="141" height="18" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="324" y="835">диагностика ≠ допуск</text></g></g></g><g data-cell-id="h"><g><path d="M 1064 789 L 1064 859.82" fill="none" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-