<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light;" version="1.1" width="1635px" height="2038px" viewBox="0 0 1635 2038"><title>Tool Profile: политика, клиент и допуск к выполнению</title><desc>Конфигурация, диагностический каталог, runtime proof и приёмка candidate имеют отдельные критерии.</desc><rect x="0" y="0" width="1635" height="2038" fill="#FFFFFF" /><defs /><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="25" y="24" width="1560" height="52" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="27" y="60" fill="#18324F" font-family="Arial" font-size="32px" style="fill: rgb(24, 50, 79);">Tool Profile: политика, клиент и допуск к выполнению</text></g></g></g><g data-cell-id="desc"><g><rect x="25" y="81" width="1560" height="40" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="27" y="107" fill="#18324F" font-family="Arial" font-size="19px" style="fill: rgb(24, 50, 79);">Конфигурация, диагностический каталог, runtime proof и приёмка candidate имеют отдельные критерии.</text></g></g></g><g data-cell-id="profiles"><g><rect x="25" y="144" width="1560" height="145" rx="14.5" ry="14.5" fill="#e8f6f2" stroke="#3d8173" stroke-width="2" pointer-events="all" style="fill: rgb(232, 246, 242); stroke: rgb(61, 129, 115);" /></g><g><g><text x="805" y="187" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="805" y="187">8 встроенных профилей, version 1</tspan><tspan x="805" y="211">baseline · coding · architecture · reviewer-readonly</tspan><tspan x="805" y="235">browser-testing · documents · coding-context7 · architecture-context7</tspan><tspan x="805" y="259">Docling для documents исключён и не установлен; baseline от него не зависит</tspan></text></g></g></g><g data-cell-id="policy"><g><rect x="25" y="354" width="1560" height="130" rx="13" ry="13" fill="#eaf2fb" stroke="#53779d" stroke-width="2" pointer-events="all" style="fill: rgb(234, 242, 251); stroke: rgb(83, 119, 157);" /></g><g><g><text x="805" y="401" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="805" y="401">Strict YAML policy → profile/config digest</tspan><tspan x="805" y="425">Backend · role · allow/deny · required dependencies · canonical worktree/cache binding</tspan><tspan x="805" y="449">Render сохраняет выбранные model/provider и native auth; missing required dependency → BLOCKED</tspan></text></g></g></g><g data-cell-id="probe"><g><rect x="25" y="544" width="1560" height="130" rx="13" ry="13" fill="#f0f3f7" stroke="#718297" stroke-width="2" pointer-events="all" style="fill: rgb(240, 243, 247); stroke: rgb(113, 130, 151);" /></g><g><g><text x="805" y="591" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="805" y="591">Dependency preflight / диагностический catalog</tspan><tspan x="805" y="615">Executable + version → contained process → initialize → tools/list → ping → stopped tree</tspan><tspan x="805" y="639">READY подтверждает конкретный probe; не доказывает enforcement будущего model turn</tspan></text></g></g></g><g data-cell-id="codex"><g><rect x="25" y="749" width="730" height="170" rx="17" ry="17" fill="#eaf2fb" stroke="#53779d" stroke-width="2" pointer-events="all" style="fill: rgb(234, 242, 251); stroke: rgb(83, 119, 157);" /></g><g><g><text x="390" y="804" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="390" y="804">Codex native renderer</tspan><tspan x="390" y="828">mcp_servers · enabled/disabled tools</tspan><tspan x="390" y="852">Disposable app-server catalog без model turn</tspan><tspan x="390" y="876">Диагностика: qualified_for_exec = false</tspan></text></g></g></g><g data-cell-id="oc"><g><rect x="855" y="749" width="730" height="170" rx="17" ry="17" fill="#eaf2fb" stroke="#53779d" stroke-width="2" pointer-events="all" style="fill: rgb(234, 242, 251); stroke: rgb(83, 119, 157);" /></g><g><g><text x="1220" y="804" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="1220" y="804">OpenCode V2 native renderer</tspan><tspan x="1220" y="828">harness-leaf · permissions · deny policies</tspan><tspan x="1220" y="852">Code Mode off · pool off</tspan><tspan x="1220" y="876">Fresh native permission / catalog / exact-session probes</tspan></text></g></g></g><g data-cell-id="cxdeny"><g><rect x="25" y="999" width="730" height="200" rx="20" ry="20" fill="#fff3e0" stroke="#b7802f" stroke-width="2" pointer-events="all" style="fill: rgb(255, 243, 224); stroke: rgb(183, 128, 47);" /></g><g><g><text x="390" y="1057" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="390" y="1057">Strict Codex — EXPERIMENTAL transport</tspan><tspan x="390" y="1081">Тот же owned app-server thread: census → turn → census</tspan><tspan x="390" y="1105">0.167.0: проверен scripted provider; paid workload UNQUALIFIED</tspan><tspan x="390" y="1129">Fresh runtime qualification перед каждым новым run</tspan><tspan x="390" y="1153">Без доказательства → BLOCKED_NOT_QUALIFIED</tspan></text></g></g></g><g data-cell-id="ocguard"><g><rect x="855" y="999" width="730" height="200" rx="20" ry="20" fill="#eaf2fb" stroke="#53779d" stroke-width="2" pointer-events="all" style="fill: rgb(234, 242, 251); stroke: rgb(83, 119, 157);" /></g><g><g><text x="1220" y="1057" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="1220" y="1057">Реальный OpenCode invocation + private guard</tspan><tspan x="1220" y="1081">Role / wire catalog audit → before_dispatch</tspan><tspan x="1220" y="1105">after_response: actual EOF или confirmed consumer cancel</tspan><tspan x="1220" y="1129">Read error / failed cancel / disconnect не дают receipt</tspan><tspan x="1220" y="1153">Native clean stop и полный JSONL обязательны отдельно</tspan></text></g></g></g><g data-cell-id="pin"><g><rect x="25" y="1289" width="1560" height="155" rx="15.5" ry="15.5" fill="#f0f3f7" stroke="#718297" stroke-width="2" pointer-events="all" style="fill: rgb(240, 243, 247); stroke: rgb(113, 130, 151);" /></g><g><g><text x="805" y="1337" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="805" y="1337">Durable completion receipt — совместное доказательство</tspan><tspan x="805" y="1361">Exact session · client/profile/config/source digests · usage · pinned JSONL/catalog</tspan><tspan x="805" y="1385">Native finish + exit 0 + process tree stopped; неполный JSONL / finish → UNKNOWN</tspan><tspan x="805" y="1409">OpenCode: before_dispatch всегда; при подключённых MCP: before_dispatch + after_response</tspan></text></g></g></g><g data-cell-id="gate"><g><rect x="25" y="1524" width="1560" height="135" rx="13.5" ry="13.5" fill="#e8f1f6" stroke="#486b83" stroke-width="2" pointer-events="all" style="fill: rgb(232, 241, 246); stroke: rgb(72, 107, 131);" /></g><g><g><text x="805" y="1574" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="805" y="1574">Freeze → independent checks / requirements → fresh independent review → final gate</tspan><tspan x="805" y="1598">Тот же candidate и актуальные source/tool/index provenance</tspan><tspan x="805" y="1622">Только gate подтверждает результат задачи; успешный MCP call не означает ACCEPTED</tspan></text></g></g></g><g data-cell-id="bounds"><g><rect x="25" y="1734" width="1560" height="155" rx="15.5" ry="15.5" fill="#fff3e0" stroke="#b7802f" stroke-width="2" pointer-events="all" style="fill: rgb(255, 243, 224); stroke: rgb(183, 128, 47);" /></g><g><g><text x="805" y="1782" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="805" y="1782">Общая граница</tspan><tspan x="805" y="1806">MCP server работает на пользовательском host; OpenRouter — provider модели native OpenCode.</tspan><tspan x="805" y="1830">Baseline не требует новых MCP. Нет auto-install tools, новой БД, обязательного daemon или нового model API.</tspan><tspan x="805" y="1854">Наблюдённый Hydrogen + Serena + Context7 smoke не является общей квалификацией всех моделей и проектов.</tspan></text></g></g></g><g data-cell-id="e1"><g><path d="M 805 289 L 805 343.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 805 351.76 L 801 343.76 L 809 343.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g></g><g data-cell-id="e2"><g><path d="M 805 484 L 805 533.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 805 541.76 L 801 533.76 L 809 533.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g></g><g data-cell-id="e3"><g><path d="M 415 674 L 415 711.5 L 390 711.5 L 390 738.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 390 746.76 L 386 738.76 L 394 738.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="376" y="701" width="54" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="402.5" y="719.5">Codex</text></g></g></g><g data-cell-id="e4"><g><path d="M 1195 674 L 1195 711.5 L 1220 711.5 L 1220 738.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 1220 746.76 L 1216 738.76 L 1224 738.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="1164" y="701" width="89" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="1207.5" y="719.5">OpenCode</text></g></g></g><g data-cell-id="e5"><g><path d="M 390 919 L 390 988.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 390 996.76 L 386 988.76 L 394 988.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="311" y="949" width="159" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="390" y="967">execution boundary</text></g></g></g><g data-cell-id="e6"><g><path d="M 1220 919 L 1220 988.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 1220 996.76 L 1216 988.76 L 1224 988.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="1141" y="949" width="159" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="1220" y="967">execution boundary</text></g></g></g><g data-cell-id="e7"><g><path d="M 390 1199 L 390 1244 L 415 1244 L 415 1278.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 415 1286.76 L 411 1278.76 L 419 1278.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="324" y="1234" width="159" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="403" y="1252">required fresh proof</text></g></g></g><g data-cell-id="e8"><g><path d="M 1220 1199 L 1220 1244 L 1195 1244 L 1195 1278.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 1195 1286.76 L 1191 1278.76 L 1199 1278.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="1128" y="1234" width="159" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="1207" y="1252">required fresh proof</text></g></g></g><g data-cell-id="e9"><g><path d="M 805 1444 L 805 1513.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 805 1521.76 L 801 1513.76 L 809 1513.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="705" y="1474" width="201" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="805" y="1492">completion ≠ acceptance</text></g></g></g><g data-cell-id="footer"><g><rect x="25" y="1944" width="1560" height="45" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="27" y="1972" fill="#18324F" font-family="Arial" font-size="17px" style="fill: rgb(24, 50, 79);">Source main после 1.7.0 • Tool success, exit 0 и catalog READY по отдельности не подтверждают завершение задачи.</text></g></g></g></g></g></g></svg>