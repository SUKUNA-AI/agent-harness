<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" version="1.1" width="1413px" height="1529px" viewBox="0 0 1413 1529" role="img" aria-labelledby="title desc"><desc id="desc">Codex diagnostic catalog не является допуском: strict managed transport использует owned stdio thread, before/after native census и свежую qualification. OpenCode требует свой guard. Приёмка остаётся отдельной.</desc><title id="title">Tool Profile: native client qualification и runtime receipt</title><defs /><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);" /><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="24" y="24" width="1340" height="45" fill="none" stroke="none" pointer-events="all" /></g><g><g fill="#000000" font-family="Arial" font-weight="bold" text-anchor="start" font-size="25px" style="fill: rgb(0, 0, 0);"><text x="26" y="55">Tool Profile: политика, клиент и допуск к выполнению</text></g></g></g><g data-cell-id="desc"><g><rect x="24" y="79" width="1340" height="55" fill="none" stroke="none" pointer-events="all" /></g><g><g fill="#000000" font-family="Arial" font-weight="bold" text-anchor="start" font-size="17px" style="fill: rgb(0, 0, 0);"><text x="26" y="102">Профиль и диагностический каталог не заменяют qualification и приёмку candidate.</text></g></g></g><g data-cell-id="a"><g><path d="M 544 269 L 544 301.5 L 324 301.5 L 324 324.82" fill="none" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 324 332.32 L 320.25 324.82 L 327.75 324.82 Z" fill="#526a82" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#000000" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(0, 0, 0);"><rect fill="#FFFFFF" stroke="none" x="394" y="294" width="81" 