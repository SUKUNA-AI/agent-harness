<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" version="1.1" width="1413px" height="1534px" viewBox="0 0 1413 1534" role="img" aria-labelledby="title desc"><desc id="desc">Один writer на worktree; продолжение сохраняет session, provenance и исходные budgets. Приёмка требует свежих evidence.</desc><title id="title">Managed tooling: isolation, exact resume и acceptance</title><defs /><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);" /><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="24" y="24" width="1340" height="45" fill="none" stroke="none" pointer-events="all" /></g><g><g fill="#000000" font-family="Arial" font-weight="bold" text-anchor="start" font-size="25px" style="fill: rgb(0, 0, 0);"><text x="26" y="55">Managed tooling: isolation, exact resume и acceptance</text></g></g></g><g data-cell-id="desc"><g><rect x="24" y="79" width="1340" height="55" fill="none" stroke="none" pointer-events="all" /></g><g><g fill="#000000" font-family="Arial" font-weight="bold" text-anchor="start" font-size="17px" style="fill: rgb(0, 0, 0);"><text x="26" y="102">Один writer на worktree. Общий scheduler для Codex/OpenCode; исходные budgets сохраняются.</text></g></g></g><g data-cell-id="a1"><g><path d="M 382 274 L 382 314 L 324 314 L 324 344.82" fill="none" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 324 352.32 L 320.25 344.82 L 327.75 344.82 Z" fill="#526a82" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#000000" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(0, 0, 0);"><rect fill="#FFFFFF" stroke="none" x="305" y="306" width="97" height="18" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="353" y="320">owned scope A</text></g></g></g><g data-cell-id="b1"><g><path d="M 1006 274 L 1006 314 L 1064 314 L 1064 344.82" fill="none" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 1064 352.32 L 1060.25 344.82 L 1067.75 344.82 Z" fill="#526a82" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#000000" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(0, 0, 0);"><rect fill="#FFFFFF" stroke="none" x="987" y="306" width="98" height="18" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="1035" y="320">owned scope B</text></g></g></g><g data-cell-id="a2"><g><path d="M 324 499 L 324 541.5 L 544 541.5 L 544 574.82" fill="none" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 544 582.32 L 540.25 574.82 L 547.75 574.82 Z" fill="#526a82" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g></g><g data-cell-id="b2"><g><path d="M 1064 499 L 1064 541.5 L 844 541.5 L 844 574.82" fill="none" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 844 582.32 L 840.25 574.82 L 847.75 574.82 Z" fill="#526a82" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g></g><g data-cell-id="direct"><g><path d="M 694 694 L 694 1164.82" fill="none" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 694 1172.32 L 690.25 1164.82 L 697.75 1164.82 Z" fill="#526a82" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 