ke: rgb(82, 106, 130);" /><path d="M 605.68 1004 L 613.18 1000.25 L 613.18 1007.75 Z" fill="#526a82" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#000000" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(0, 0, 0);"><rect fill="#FFFFFF" stroke="none" x="531" y="926" width="148" height="18" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="604" y="940">проверка не пройдена</text></g></g></g><g data-cell-id="r4"><g><path d="M 1064 884 L 1064 974.82" fill="none" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 1064 982.32 L 1060.25 974.82 L 1067.75 974.82 Z" fill="#526a82" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#000000" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(0, 0, 0);"><rect fill="#FFFFFF" stroke="none" x="993" y="926" width="144" height="18" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="1064" y="940">identity подтверждена</text></g></g></g><g data-cell-id="r5"><g><path d="M 1064 1084 L 1064 1129 L 946 1129 L 946 1164.82" fill="none" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 946 1172.32 L 942.25 1164.82 L 949.75 1164.82 Z" fill="#526a82" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#000000" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(0, 0, 0);"><rect fill="#FFFFFF" stroke="none" x="950" y="1121" width="112" height="18" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="1005" y="1135">после completion</text></g></g></g><g data-cell-id="r6"><g><path d="M 694 1294 L 694 1364.82" fill="none" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 694 1372.32 L 690.25 1364.82 L 697.75 1364.82 Z" fill="#526a82" stroke="#526a82" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#000000" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(0, 0, 0);"><rect fill="#FFFFFF" stroke="none" x="642" y="1326" width="105" height="18" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="694" y="1340">accepted receipt</text></g></g></g><g data-cell-id="sup"><g><rect x="174" y="164" width="1040" height="110" rx="16.5" ry="16.5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);" /></g><g><g><switch><text x="694" y="204" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="694" y="204">Supervisor: Strict YAML contract/plan + JSONL journal</tspan><tspan x="694" y="224">DAG · scopes · до 12 managed sessions, включая до 3 reviewers</tspan><tspan x="694" y="244">Private ownership / process identity / receipts</tspan></text></switch></g></g></g><g data-cell-id="a"><g><rect x="44" y="354" width="560" height="145" rx="21.75" ry="21.75" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);" /></g><g><g><switch><text x="324" y="402" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="324" y="402">Leaf A: harness-owned worktree A</tspan><tspan x="324" y="422">canonical cwd A · scope A</tspan><tspan x="324" y="442">свой stdio MCP / private cache</tspan><tspan x="324" y="462">native tools по квалифицированной роли</tspan></text></switch></g></g></g><g data-cell-id="b"><g><rect x="784" y="354" width="560" height="145" rx="21.75" ry="21.75" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);" /></g><g><g><switch><text x="1064" y="402" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="1064" y="402">Leaf B: harness-owned worktree B</tspan><tspan x="1064" y="422">canonical cwd B · scope B</tspan><tspan x="1064" y="442">отдельный stdio MCP / private cache</tspan><tspan x="1064" y="462">никакого shared mutable project instance</tspan></text></switch></g></g></g><g data-cell-id="receipts"><g><rect x="444" y="584" width="500" height="110" rx="16.5" ry="16.5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);" /></g><g><g><switch><text x="694" y="624" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="694" y="624">Invocation → completion</tspan><tspan x="694" y="644">Exact session ID · client/profile/config digests</tspan><tspan x="694" y="664">usage + stopped process tree + pinned JSONL/catalog</tspan></text></switch></g></g></g><g data-cell-id="interrupt"><g><rect x="44" y="784" width="560" height="100" rx="15" ry="15" fill="#fff2cc" stroke="#b58b00" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 242, 204); stroke: rgb(181, 139, 0);" /></g><g><g><switch><text x="324" y="819" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="324" y="819">Interruption / unknown outcome</tspan><tspan x="324" y="839">Сначала определить фактический исход</tspan><tspan x="324" y="859">Не повторять вызов вслепую</tspan></text></switch></g></g></g><g data-cell-id="resume"><g><rect x="784" y="784" width="560" height="100" rx="15" ry="15" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);" /></g><g><g><switch><text x="1064" y="819" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="1064" y="819">Exact resume reconciliation</tspan><tspan x="1064" y="839">process + session + physical worktree</tspan><tspan x="1064" y="859">profile/dependencies/source/index provenance</tspan></text></switch></g></g></g><g data-cell-id="deny"><g><rect x="44" y="984" width="560" height="100" rx="15" ry="15" fill="#f8cecc" stroke="#b85450" stroke-width="1.5" pointer-events="all" style="fill: rgb(248, 206, 204); stroke: rgb(184, 84, 80);" /></g><g><g><switch><text x="324" y="1019" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="324" y="1019">Drift или неполное evidence</tspan><tspan x="324" y="1039">BLOCKED / recovery required</tspan><tspan x="324" y="1059">--last и пересказ не являются exact resume</tspan></text></switch></g></g></g><g data-cell-id="cont"><g><rect x="784" y="984" width="560" height="100" rx="15" ry="15" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);" /></g><g><g><switch><text x="1064" y="1019" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="1064" y="1019">Продолжение в том же run</tspan><tspan x="1064" y="1039">Сохранённый session ID / backend / worktree</tspan><tspan x="1064" y="1059">Прежние attempts, tokens и deadline</tspan></text></switch></g></g></g><g data-cell-id="integrate"><g><rect x="274" y="1174" width="840" height="120" rx="18" ry="18" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" pointer-events="all" style="fill: rgb(213, 232, 212); stroke: rgb(130, 179, 102);" /></g><g><g><switch><text x="694" y="1219" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="694" y="1219">Integration и source-bound acceptance</tspan><tspan x="694" y="1239">local checks → scoped integration → integrated checks</tspan><tspan x="694" y="1259">freeze → requirement coverage → independent review → gate</tspan></text></switch></g></g></g><g data-cell-id="verify"><g><rect x="174" y="1374" width="1040" height="110" rx="16.5" ry="16.5" fill="#fff2cc" stroke="#b58b00" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 242, 204); stroke: rgb(181, 139, 0);" /></g><g><g><switch><text x="694" y="1414" fill="#000000" font-family="Arial" font-size="17px" text-anchor="middle" style="fill: rgb(0, 0, 0);"><tspan x="694" y="1414">Свежесть после сохранённого ACCEPTED</tspan><tspan x="694" y="1434">status --verify-evidence повторно проверяет candidate, inputs и artifacts</tspan><tspan x="694" y="1454">Изменение bytes / потеря receipt → STALE; история не переписывается</tspan></text></switch></g></g></g></g></g></g></svg>