<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light;" version="1.1" width="1740px" height="1868px" viewBox="0 0 1740 1868"><title>Managed tooling: isolation, exact resume и acceptance</title><desc>Общий scheduler Codex/OpenCode сохраняет ownership и исходные budgets. Один writer на физический worktree.</desc><rect x="0" y="0" width="1740" height="1868" fill="#FFFFFF" /><defs /><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="25" y="24" width="1560" height="52" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="27" y="60" fill="#18324F" font-family="Arial" font-size="32px" style="fill: rgb(24, 50, 79);">Managed tooling: isolation, exact resume и acceptance</text></g></g></g><g data-cell-id="desc"><g><rect x="25" y="81" width="1560" height="40" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="27" y="107" fill="#18324F" font-family="Arial" font-size="19px" style="fill: rgb(24, 50, 79);">Общий scheduler Codex/OpenCode сохраняет ownership и исходные budgets. Один writer на физический worktree.</text></g></g></g><g data-cell-id="sup"><g><rect x="25" y="144" width="1560" height="140" rx="14" ry="14" fill="#eaf2fb" stroke="#53779d" stroke-width="2" pointer-events="all" style="fill: rgb(234, 242, 251); stroke: rgb(83, 119, 157);" /></g><g><g><text x="805" y="196" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="805" y="196">Supervisor: Strict YAML contract / plan + private JSONL journal</tspan><tspan x="805" y="220">DAG · scopes · до 12 managed sessions, включая до 3 reviewers · checkpoints · bounded retry</tspan><tspan x="805" y="244">Codex по умолчанию; OpenCode — optional managed leaf; OpenCode-native subagents NOT_IMPLEMENTED</tspan></text></g></g></g><g data-cell-id="a"><g><rect x="25" y="379" width="730" height="190" rx="19" ry="19" fill="#e8f6f2" stroke="#3d8173" stroke-width="2" pointer-events="all" style="fill: rgb(232, 246, 242); stroke: rgb(61, 129, 115);" /></g><g><g><text x="390" y="432" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="390" y="432">Leaf A: harness-owned worktree A</tspan><tspan x="390" y="456">Canonical cwd A · scope A · own native client</tspan><tspan x="390" y="480">Serena: отдельный server / project / private cache</tspan><tspan x="390" y="504">Context7: public docs / native connection</tspan><tspan x="390" y="528">Finite browser context A + private artifacts A</tspan></text></g></g></g><g data-cell-id="b"><g><rect x="855" y="379" width="730" height="190" rx="19" ry="19" fill="#e8f6f2" stroke="#3d8173" stroke-width="2" pointer-events="all" style="fill: rgb(232, 246, 242); stroke: rgb(61, 129, 115);" /></g><g><g><text x="1220" y="432" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="1220" y="432">Leaf B: harness-owned worktree B</tspan><tspan x="1220" y="456">Canonical cwd B · scope B · own native client</tspan><tspan x="1220" y="480">Serena: другой server / project / private cache</tspan><tspan x="1220" y="504">Нет shared mutable project instance</tspan><tspan x="1220" y="528">Finite browser context B + private artifacts B</tspan></text></g></g></g><g data-cell-id="receipts"><g><rect x="25" y="659" width="1560" height="155" rx="15.5" ry="15.5" fill="#f0f3f7" stroke="#718297" stroke-width="2" pointer-events="all" style="fill: rgb(240, 243, 247); stroke: rgb(113, 130, 151);" /></g><g><g><text x="805" y="707" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="805" y="707">Invocation → durable completion receipts</tspan><tspan x="805" y="731">Exact session · client/profile/config digests · usage · pinned JSONL / catalog / runtime audits</tspan><tspan x="805" y="755">Native finish + exit 0 + stopped process tree; неполные доказательства → UNKNOWN</tspan><tspan x="805" y="779">Graphify index: frozen source + commit/dirty snapshot + config/tool/index digests; drift инвалидирует index</tspan></text></g></g></g><g data-cell-id="interrupt"><g><rect x="25" y="919" width="730" height="130" rx="13" ry="13" fill="#fff3e0" stroke="#b7802f" stroke-width="2" pointer-events="all" style="fill: rgb(255, 243, 224); stroke: rgb(183, 128, 47);" /></g><g><g><text x="390" y="966" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="390" y="966">Interruption / unknown outcome</tspan><tspan x="390" y="990">Сначала определить фактический исход</tspan><tspan x="390" y="1014">Не повторять invocation вслепую</tspan></text></g></g></g><g data-cell-id="resume"><g><rect x="855" y="919" width="730" height="130" rx="13" ry="13" fill="#eaf2fb" stroke="#53779d" stroke-width="2" pointer-events="all" style="fill: rgb(234, 242, 251); stroke: rgb(83, 119, 157);" /></g><g><g><text x="1220" y="966" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="1220" y="966">Exact resume reconciliation</tspan><tspan x="1220" y="990">Process + session + physical worktree identity</tspan><tspan x="1220" y="1014">Client / profile / dependencies / source / index provenance</tspan></text></g></g></g><g data-cell-id="deny"><g><rect x="25" y="1149" width="730" height="130" rx="13" ry="13" fill="#fff3e0" stroke="#b7802f" stroke-width="2" pointer-events="all" style="fill: rgb(255, 243, 224); stroke: rgb(183, 128, 47);" /></g><g><g><text x="390" y="1196" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="390" y="1196">Drift или неполное evidence</tspan><tspan x="390" y="1220">BLOCKED / recovery required</tspan><tspan x="390" y="1244">--last и пересказ не являются exact resume</tspan></text></g></g></g><g data-cell-id="cont"><g><rect x="855" y="1149" width="730" height="150" rx="15" ry="15" fill="#eaf2fb" stroke="#53779d" stroke-width="2" pointer-events="all" style="fill: rgb(234, 242, 251); stroke: rgb(83, 119, 157);" /></g><g><g><text x="1220" y="1194" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="1220" y="1194">Продолжение в том же run</tspan><tspan x="1220" y="1218">Прежние session / backend / worktree</tspan><tspan x="1220" y="1242">Прежние attempts, tokens и deadline</tspan><tspan x="1220" y="1266">Checkpoint → bounded retry без новой квоты</tspan></text></g></g></g><g data-cell-id="integrate"><g><rect x="25" y="1429" width="1560" height="150" rx="15" ry="15" fill="#e8f1f6" stroke="#486b83" stroke-width="2" pointer-events="all" style="fill: rgb(232, 241, 246); stroke: rgb(72, 107, 131);" /></g><g><g><text x="805" y="1474" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="805" y="1474">Integration и source-bound acceptance</tspan><tspan x="805" y="1498">Local checks → scoped integration → integrated checks → freeze</tspan><tspan x="805" y="1522">Requirement coverage + independent checks / fresh review → final gate</tspan><tspan x="805" y="1546">Completion leaf или успешный MCP call не означает ACCEPTED</tspan></text></g></g></g><g data-cell-id="verify"><g><rect x="25" y="1669" width="1560" height="100" rx="10" ry="10" fill="#f0f3f7" stroke="#718297" stroke-width="2" pointer-events="all" style="fill: rgb(240, 243, 247); stroke: rgb(113, 130, 151);" /></g><g><g><text x="805" y="1701" fill="#18324F" font-family="Arial" font-size="20px" text-anchor="middle" style="fill: rgb(24, 50, 79);"><tspan x="805" y="1701">Свежесть сохранённого ACCEPTED</tspan><tspan x="805" y="1725">status --verify-evidence сверяет candidate, inputs и artifacts</tspan><tspan x="805" y="1749">Изменение bytes / потеря receipt → STALE; история не переписывается</tspan></text></g></g></g><g data-cell-id="e1"><g><path d="M 415 284 L 415 331.5 L 390 331.5 L 390 368.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 390 376.76 L 386 368.76 L 394 368.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="342" y="321" width="123" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="402.5" y="339.5">isolated worker</text></g></g></g><g data-cell-id="e2"><g><path d="M 1195 284 L 1195 331.5 L 1220 331.5 L 1220 368.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 1220 376.76 L 1216 368.76 L 1224 368.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="1147" y="321" width="123" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="1207.5" y="339.5">isolated worker</text></g></g></g><g data-cell-id="e3"><g><path d="M 390 569 L 390 614 L 415 614 L 415 648.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 415 656.76 L 411 648.76 L 419 648.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g></g><g data-cell-id="e4"><g><path d="M 1220 569 L 1220 614 L 1195 614 L 1195 648.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 1195 656.76 L 1191 648.76 L 1199 648.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g></g><g data-cell-id="e5"><g><path d="M 415 814 L 415 866.5 L 390 866.5 L 390 908.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 390 916.76 L 386 908.76 L 394 908.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="316" y="856" width="175" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="402.5" y="874.5">interrupted / unknown</text></g></g></g><g data-cell-id="e6"><g><path d="M 755 984 L 844.76 984" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 852.76 984 L 844.76 988 L 844.76 980 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="769" y="974" width="74" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="805" y="992">reconcile</text></g></g></g><g data-cell-id="e7"><g><path d="M 1001 1049 L 1001 1099 L 390 1099 L 390 1138.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 390 1146.76 L 386 1138.76 L 394 1138.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="636" y="1089" width="119" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="695" y="1107">drift / unknown</text></g></g></g><g data-cell-id="e8"><g><path d="M 1366 1049 L 1366 1138.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 1366 1146.76 L 1362 1138.76 L 1370 1138.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="1324" y="1089" width="85" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="1366" y="1107">proof valid</text></g></g></g><g data-cell-id="e9"><g><path d="M 1220 1299 L 1220 1364 L 1195 1364 L 1195 1418.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 1195 1426.76 L 1191 1418.76 L 1199 1418.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="1150" y="1354" width="115" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="1207" y="1372">same budgets</text></g></g></g><g data-cell-id="e10"><g><path d="M 1585 736.5 L 1615 736.5 L 1615 1504 L 1595.24 1504" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 1587.24 1504 L 1595.24 1500 L 1595.24 1508 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="1540" y="1110" width="152" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="1615" y="1128.5">completion verified</text></g></g></g><g data-cell-id="e11"><g><path d="M 805 1579 L 805 1658.76" fill="none" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 106, 130);" /><path d="M 805 1666.76 L 801 1658.76 L 809 1658.76 Z" fill="#526a82" stroke="#526a82" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 106, 130); stroke: rgb(82, 106, 130);" /></g><g><g fill="#18324F" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(24, 50, 79);"><rect fill="#FFFFFF" stroke="none" x="756" y="1614" width="99" height="23" stroke-width="0" style="fill: rgb(255, 255, 255);" /><text x="805" y="1632">saved result</text></g></g></g><g data-cell-id="footer"><g><rect x="25" y="1774" width="1560" height="45" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="27" y="1802" fill="#18324F" font-family="Arial" font-size="17px" style="fill: rgb(24, 50, 79);">Source main после 1.7.0 • Native client auth остаётся в клиенте; private configs/receipts не входят в переносимый пакет.</text></g></g></g></g></g></g></svg>