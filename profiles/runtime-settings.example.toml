# Справочный профиль наблюдённой настройки 2026-10-31, НЕ замена config.toml.
# Применять отдельные значения только по запросу, после проверки schema клиента.
model_reasoning_effort = "xhigh"

[agents]
default_subagent_reasoning_effort = "medium"
enabled = true
max_concurrent_threads_per_session = 5
interrupt_message = true

# cap в файле не гарантирует runtime slots. Installer по умолчанию сохраняет
# более строгий лимит и не меняет model/provider/reasoning/security.
# Содержательные owner/reviewer high и helper medium задаются role TOML.
