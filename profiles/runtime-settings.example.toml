# Переносимый пример, НЕ замена config.toml. Без путей, секретов и MCP.
# Model/provider/reasoning/security сохраняются из текущего профиля устройства.
# Применять отдельные значения после проверки schema установленного клиента.
# Источники и приоритеты: docs/CONFIGURATION_RU.md (harness 1.5.0).

# Порог сжатия текущей истории; клиент может сжать раньше из-за лимита модели.
# Установщик сохраняет существующее явное пользовательское значение.
model_auto_compact_token_limit = 500000

[agents]
default_subagent_reasoning_effort = "medium"
# Это opt-in default для ролей без собственного effort; installer его не задаёт.
enabled = true
max_concurrent_threads_per_session = 5
interrupt_message = true

# cap в файле не гарантирует runtime slots. Installer по умолчанию сохраняет
# более строгий лимит и не меняет model/provider/reasoning/security.
# Содержательные owner/reviewer high и helper medium задаются role TOML.
