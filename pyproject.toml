[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "native-agent-harness"
version = "1.6.1"
description = "Deterministic state, verification and installation tools for native Codex orchestration"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
agent-harness = "agent_harness.cli:main"
agent-harness-session = "agent_harness.native_session:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_harness = ["schemas/*.json", "_vendor/pyyaml-manifest.json", "_vendor/yaml/LICENSE"]
