name: Portable harness checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    env:
      AGENT_HARNESS_BACKEND: python
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # actual baseline-writer migration regression
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/release_check.py
      - run: python tools/run_tests.py
      - run: python -m pip install --disable-pip-version-check "mcp==2.3.0"
      - run: python -I -B tools/check_mcp.py
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # actual baseline-writer migration regression
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Early rollback, recovery and benchmark contracts
        shell: python {0}
        run: |
          import sys
          import unittest
          sys.path[:0] = ["src", "tests"]
          names = [
              "test_boundary_spec.InstallationBoundaryTests.test_hooks_foreign_handler_idempotence_and_rollback",
              "test_hook_adoption.HookAdoptionTests.test_addressed_rollback_preserves_new_user_group_and_restores_legacy",
              "test_execution_durability.ExecutionDurabilityTests.test_successful_terminal_event_without_process_tree_cleanup_cannot_integrate",
              "test_execution_durability.ExecutionDurabilityTests.test_cleanup_fixture_does_not_mask_pre_exec_failure",
              "test_benchmark_runner.BenchmarkRunnerTests.test_full_cohort_executes_existing_engines_and_never_replays_completed_trials",
              "test_managed_scheduling.ManagedSchedulingTests.test_managed_recovery_resumes_exact_workers_and_reconciles_already_applied_patch",
          ]
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromNames(names))
          raise SystemExit(not result.wasSuccessful())
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: cargo +1.90.0 test --release --manifest-path native/Cargo.toml --locked
        working-directory: .
      - run: python tools/build_native.py
      - run: python tools/check_native.py
        env:
          AGENT_HARNESS_BACKEND: native
      - run: python tools/check_native_build.py
      - run: npm install --prefix .test-tmp/language-tools --no-audit --no-fund --ignore-scripts pyright@1.1.414
      - run: python tools/check_lsp.py
      - run: python tools/release_check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ runner.os }}
          path: bin/
          if-no-files-found: error
          retention-days: 30
